name: Runtime · Lean wasm32
run-name: Runtime wasm32 · ${{ inputs.publish || 'build' }}

# 生产 wasm32 运行时：直接编译仓根 v4.36.0 软 Fork 源码（ADR-06），不再 clone 上游
# v4.35.0 tag + 套 scripts/patches/lean-435-emscripten.patch。
# - Lean pin / 引导包 / githash 唯一来源是 wasm-foundry/scripts/pin-lean.ts
# - 编译参数保持 -O3，且不带 -sMEMORY64=1（LEAN_WASM64 默认 OFF）
# - 重新编译 Init / Std / Batteries oleans 并打包成 lean-*.pack
# 历史 4.35.0 资产（cacheKey zff98dcf5）保留在 R2 / 魔搭 / Release 不动，可单笔回滚。
# 只在手动触发和 runtime-v* tag 时运行；日常应用发布走 ci.yml。
on:
  push:
    tags: ['runtime-v*', '!runtime-v*-wasm64']
  workflow_dispatch:
    inputs:
      publish:
        description: 构建完成后发布到
        type: choice
        options:
          - none
          - r2
          - modelscope
          - both
        default: none
      verify_only:
        description: 只校验远端对象，不写入
        type: boolean
        default: false
      publish_scope:
        description: 发布范围（extensions 只上传扩展包，不动 Init 运行时）
        type: choice
        options:
          - all
          - extensions
        default: all
      build_extensions:
        description: 同时编译 Std + Batteries 扩展 pack（ADR-06 生产引擎默认需要）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: runtime-wasm32
  cancel-in-progress: false

env:
  WASM_LLVM_REV: 14ea5ecbc514b0c87338aebf8f2b567020be5750
  EMSDK_VERSION: 6.0.0
  LEAN_VERSION: 4.36.0
  LEAN_TAG: v4.36.0
  LEAN_COMMIT: 611c117bfaf7b7ae1cfcf246ce6fba31e8f509e9
  BATTERIES_TAG: v4.36.0
  BATTERIES_COMMIT: b4b25a3886a16daacaf6615c2eea7170a6e8f458

jobs:
  prepare:
    name: 准备 4.36 源码与 C 代码
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: wasm-foundry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/emsdk
          key: wasm32-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      # ADR-06：源码不再克隆上游 tag + 套外部 patch，直接编译仓根 v4.36.0 软 Fork。
      # patch-wasm32.sh 只做三件事：SRC 指向 $GITHUB_WORKSPACE、跳过上游补丁 apply、
      # 注入 LEAN_GITHASH_OVERRIDE 让产物 githash 与官方 4.36.0 引导包一致（wasm32 参数保持不动）。
      - name: 拉取 wasm-llvm 并接入软 Fork 源码
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin "$WASM_LLVM_REV"
          git -C wasm-llvm checkout -q FETCH_HEAD
          bash scripts/patch-wasm32.sh "$GITHUB_WORKSPACE/wasm-foundry"
          # 引导包与 githash 的唯一来源。
          node "$GITHUB_WORKSPACE/wasm-foundry/scripts/pin-lean.ts" "$GITHUB_WORKSPACE/wasm-foundry"
          grep -n -- '-O3\|WASM_LLVM_LEAN_SRC_DIR\|LEAN_GITHASH_OVERRIDE' wasm-llvm/producer/lean-browser/scripts/build.sh

      - name: 缓存官方 4.36 引导包
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/lean-*-linux
          key: wasm436-boot-v1-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts') }}

      - name: fetch
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          # 缓存里的源码可能带着上一次已应用的 patch；先恢复干净，让 fetch 重新应用。
          if [ -d "$WASM_LLVM_LEAN_WORK_DIR/lean4/.git" ]; then
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" reset --hard -q HEAD
            git -C "$WASM_LLVM_LEAN_WORK_DIR/lean4" clean -fdq
          fi
          bash producer/lean-browser/scripts/build.sh fetch

      - name: 缓存 runtime 产物
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            wasm-foundry/work/build-wasm
            wasm-foundry/work/emcache
          key: wasm436-runtime-v1

      - name: runtime
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk runtime

      - name: 缓存 cgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/cgen
          key: wasm436-cgen-v1

      - name: cgen
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh cgen

  finish:
    name: 编译 4.36 objects、oleans 并打包
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: wasm-foundry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake zstd

      - name: 缓存 Emscripten 6.0.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/emsdk
          key: wasm32-emsdk-6.0.0-v1

      - name: 安装 Emscripten 6.0.0
        run: |
          if [ ! -x emsdk/upstream/emscripten/emcc ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
            (cd emsdk && ./emsdk install 6.0.0 && ./emsdk activate 6.0.0)
          fi
          source emsdk/emsdk_env.sh
          emcc --version | head -n 2

      # 与 prepare 同一套软 Fork 直编配置；两个 job 各自 checkout，不能省。
      - name: 拉取 wasm-llvm 并接入软 Fork 源码
        run: |
          git init -q wasm-llvm
          git -C wasm-llvm remote add origin https://github.com/seo-rii/wasm-llvm.git
          git -C wasm-llvm fetch -q --depth 1 origin "$WASM_LLVM_REV"
          git -C wasm-llvm checkout -q FETCH_HEAD
          bash scripts/patch-wasm32.sh "$GITHUB_WORKSPACE/wasm-foundry"
          node "$GITHUB_WORKSPACE/wasm-foundry/scripts/pin-lean.ts" "$GITHUB_WORKSPACE/wasm-foundry"

      - name: 恢复官方 4.36 引导包
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/lean-*-linux
          key: wasm436-boot-v1-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts') }}

      - name: 恢复 runtime 产物
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            wasm-foundry/work/build-wasm
            wasm-foundry/work/emcache
          key: wasm436-runtime-v1

      - name: 恢复 cgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/cgen
          key: wasm436-cgen-v1

      - name: 写入 emsdk 路径
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh emsdk

      - name: 缓存 objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/obj
          key: wasm436-obj-o3-v2-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts', 'wasm-foundry/scripts/patch-wasm32.sh', 'src/CMakeLists.txt', 'src/include/lean/lean.h', 'src/kernel/replace_fn.cpp', 'src/Lean/Meta/WHNF.lean', 'src/Lean/Meta/Tactic/Simp/Main.lean', 'src/runtime/thread.cpp', 'src/runtime/io.cpp', 'src/util/shell.cpp') }}

      - name: objects
        id: objects
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh objects

      - name: 立即保存 objects 缓存
        if: always() && steps.objects.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/obj
          key: wasm436-obj-o3-v2-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts', 'wasm-foundry/scripts/patch-wasm32.sh', 'src/CMakeLists.txt', 'src/include/lean/lean.h', 'src/kernel/replace_fn.cpp', 'src/Lean/Meta/WHNF.lean', 'src/Lean/Meta/Tactic/Simp/Main.lean', 'src/runtime/thread.cpp', 'src/runtime/io.cpp', 'src/util/shell.cpp') }}

      - name: link
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh link

      - name: 准备 modules.txt
        run: |
          BOOT="$(find "$GITHUB_WORKSPACE/wasm-foundry/work" -maxdepth 1 -type d -name 'lean-*-linux' -print -quit)"
          [ -n "$BOOT" ] || { echo '找不到 lean-*-linux 引导目录'; exit 1; }
          (cd "$BOOT/lib/lean" && find Init Std Lean -name '*.olean' | sed 's/\.olean$//'; printf '%s\n' Init Std Lean) \
            | LC_ALL=C sort > "$GITHUB_WORKSPACE/wasm-foundry/work/modules.txt"
          wc -l "$GITHUB_WORKSPACE/wasm-foundry/work/modules.txt"

      - name: 缓存 4.36 Init oleans
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/olean32
          key: wasm436-olean32-v2-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts', 'wasm-foundry/scripts/patch-wasm32.sh') }}

      - name: 重新编译 4.36 Init oleans
        timeout-minutes: 300
        run: |
          source emsdk/emsdk_env.sh
          cd wasm-llvm
          export EMSDK="$GITHUB_WORKSPACE/wasm-foundry/emsdk"
          export WASM_LLVM_LEAN_SRC_DIR="$GITHUB_WORKSPACE"
          export WASM_LLVM_LEAN_WORK_DIR="$GITHUB_WORKSPACE/wasm-foundry/work"
          export WASM_LLVM_LEAN_JOBS=3
          bash producer/lean-browser/scripts/build.sh oleans
          find "$GITHUB_WORKSPACE/wasm-foundry/work/olean32" -name '*.olean' | wc -l

      - name: 冒烟：用 4.36 运行时编译 import Init
        run: |
          set -uo pipefail
          mkdir -p work/mini
          printf 'import Init\nexample : 1 + 1 = 2 := rfl\n' > work/mini/Mini.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/mini work/olean32 -- \
            -j1 -R /src -o /src/Mini.olean /src/Mini.lean 2>&1 | tee work/mini.log
          test -s work/mini/Mini.olean || { echo '最小文件没有产出 olean'; exit 1; }
          echo '4.36 runtime + Init oleans 冒烟通过'

      - name: 打包 4.36 发布资产（zstd + 清单）
        run: |
          # 上游 package.mjs 会读 <work>/lean4/LICENSE（历史布局：源码 clone 进 work/lean4）。
          # ADR-06 之后源码在仓根，这里补一份，保持上游脚本零改动。
          mkdir -p work/lean4
          cp "$GITHUB_WORKSPACE/LICENSE" work/lean4/LICENSE
          node wasm-llvm/producer/lean-browser/scripts/package.mjs --work work --out work/artifact
          node scripts/package-runtime-assets.mjs \
            --artifact work/artifact \
            --lean-version "$LEAN_VERSION" \
            --revision "$WASM_LLVM_REV" \
            --key-prefix "wasm-lean4/$LEAN_VERSION" \
            --mirror-prefix "wasm-lean4/$LEAN_VERSION" \
            --fallback-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-v${LEAN_VERSION}/" \
            --manifest-out work/artifact/runtime-manifest.json
          ls -lh work/artifact

      - name: 缓存 4.36 Std 扩展 oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/std-olean32
          key: wasm436-std-olean32-v2-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts', 'wasm-foundry/scripts/patch-wasm32.sh') }}

      - name: 编译 4.36 Std 扩展 oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        timeout-minutes: 300
        run: |
          BOOT="$(find "$GITHUB_WORKSPACE/wasm-foundry/work" -maxdepth 1 -type d -name 'lean-*-linux' -print -quit)"
          [ -n "$BOOT" ] || { echo '找不到 lean-*-linux 引导目录'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/wasm-foundry/work/std-olean32"
          cp -a "$GITHUB_WORKSPACE/wasm-foundry/work/olean32/Init" "$GITHUB_WORKSPACE/wasm-foundry/work/std-olean32/"
          (
            cd "$GITHUB_WORKSPACE/src"
            (cd "$BOOT/lib/lean" && find Init Std -name '*.olean' | sed 's/\.olean$//'; printf 'Init\nStd\n') \
              | LC_ALL=C sort > "$GITHUB_WORKSPACE/wasm-foundry/work/std-modules.txt"
            : > "$GITHUB_WORKSPACE/wasm-foundry/work/deps.txt"
            while read -r module; do
              deps="$(LEAN_PATH="$BOOT/lib/lean" "$BOOT/bin/lean" --deps "$module.lean" | sed "s#^$BOOT/lib/lean/##; s#\.olean\$##" | tr '\n' ' ')"
              printf '%s: %s\n' "$module" "$deps" >> "$GITHUB_WORKSPACE/wasm-foundry/work/deps.txt"
            done < "$GITHUB_WORKSPACE/wasm-foundry/work/std-modules.txt"
          )
          node wasm-llvm/producer/lean-browser/scripts/build-oleans.mjs \
            "$GITHUB_WORKSPACE/wasm-foundry/work/dist/lean.mjs" \
            "$GITHUB_WORKSPACE/wasm-foundry/work" \
            "$GITHUB_WORKSPACE/src" \
            "$GITHUB_WORKSPACE/wasm-foundry/work/std-olean32" \
            3 Init Std
          find "$GITHUB_WORKSPACE/wasm-foundry/work/std-olean32/Std" -name '*.olean' | wc -l

      - name: 冒烟：wasm 运行时 import Std
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          mkdir -p work/std-src
          printf 'import Std\nexample : 1 + 1 = 2 := rfl\n' > work/std-src/Test.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/std-src work/std-olean32 -- \
            -j1 -R /src -o /src/Test.olean /src/Test.lean
          test -s work/std-src/Test.olean

      - name: 打包 Std 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          node scripts/package-runtime-extension.mjs \
            --oleans work/std-olean32 --prefix Std --name lean-std --out work/extensions/std
          ls -lh work/extensions/std

      - name: 上传 Std 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm32-std-pack
          path: wasm-foundry/work/extensions/std/**
          if-no-files-found: warn

      - name: 缓存 Batteries 源码
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/batteries
          key: batteries-v4.36.0

      - name: 拉取 Batteries 4.36.0
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          if [ ! -d work/batteries/.git ]; then
            rm -rf work/batteries
            git clone --depth 1 --branch "$BATTERIES_TAG" https://github.com/leanprover-community/batteries.git work/batteries
          fi
          actual="$(git -C work/batteries rev-parse HEAD)"
          test "$actual" = "$BATTERIES_COMMIT" || { echo "Batteries commit $actual != $BATTERIES_COMMIT"; exit 1; }

      - name: 缓存 Batteries oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/batteries-olean32
          key: wasm436-batteries-olean32-v2-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts', 'wasm-foundry/scripts/patch-wasm32.sh') }}

      - name: 准备 Batteries 无 Lean 子集
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          BOOT="$(find "$GITHUB_WORKSPACE/wasm-foundry/work" -maxdepth 1 -type d -name 'lean-*-linux' -print -quit)"
          [ -n "$BOOT" ] || { echo '找不到 lean-*-linux 引导目录'; exit 1; }
          # 整目录复制：除了 Init/ Std/ 子目录，根级 Init.olean/Std.olean 和 .ir
          # 也要带上，build-oleans 才会把它们当作已构建，只编译 Batteries。
          # 不删目录，避免把缓存里已有的 Batteries oleans 清掉。
          mkdir -p work/batteries-olean32
          cp -a work/std-olean32/. work/batteries-olean32/
          node scripts/prepare-batteries-extension.mjs \
            --batteries work/batteries --bootstrap "$BOOT" \
            --work work --out-src work/batteries-filtered --out-deps work/deps.txt

      - name: 编译 Batteries 子集 oleans
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        timeout-minutes: 300
        run: |
          set +e
          node wasm-llvm/producer/lean-browser/scripts/build-oleans.mjs \
            "$GITHUB_WORKSPACE/wasm-foundry/work/dist/lean.mjs" \
            "$GITHUB_WORKSPACE/wasm-foundry/work" \
            "$GITHUB_WORKSPACE/wasm-foundry/work/batteries-filtered" \
            "$GITHUB_WORKSPACE/wasm-foundry/work/batteries-olean32" \
            3 Init Std Batteries
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- 诊断：生成的 Batteries.lean 前 8 行 ---'
            head -n 8 work/batteries-filtered/Batteries.lean
            echo '--- 诊断：outDir 根级文件 ---'
            find work/batteries-olean32 -maxdepth 1 -type f | head -n 15
            echo '--- 诊断：失败日志 ---'
            head -n 40 work/Batteries.olean-fail.log 2>/dev/null || true
          else
            find "$GITHUB_WORKSPACE/wasm-foundry/work/batteries-olean32/Batteries" -name '*.olean' | wc -l
          fi
          exit "$status"

      - name: 保存 Batteries oleans（失败也保留进度）
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_extensions
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm-foundry/work/batteries-olean32
          key: wasm436-batteries-olean32-v2-${{ hashFiles('wasm-foundry/scripts/pin-lean.ts', 'wasm-foundry/scripts/patch-wasm32.sh') }}

      - name: 冒烟：wasm 运行时 import Batteries
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          mkdir -p work/batteries-src
          printf 'import Batteries\nexample : 1 + 1 = 2 := rfl\n' > work/batteries-src/Test.lean
          node wasm-llvm/producer/lean-browser/scripts/run-lean.mjs \
            work/dist/lean.mjs work/batteries-src work/batteries-olean32 -- \
            -j1 -R /src -o /src/Test.olean /src/Test.lean
          test -s work/batteries-src/Test.olean

      - name: 打包 Batteries 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          node scripts/package-runtime-extension.mjs \
            --oleans work/batteries-olean32 --prefix Batteries --name lean-batteries --out work/extensions/batteries
          ls -lh work/extensions/batteries

      - name: 上传 Batteries 扩展 pack
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm32-batteries-pack
          path: wasm-foundry/work/extensions/batteries/**
          if-no-files-found: warn

      - name: 记录构建参数
        if: always()
        run: |
          {
            echo "lean=$LEAN_VERSION"
            echo "lean-commit=$LEAN_COMMIT"
            echo "wasm-llvm-rev=$WASM_LLVM_REV"
            echo "emsdk=$EMSDK_VERSION"
            echo "optimization=-O3"
          } | tee work/build-flags.txt

      - name: 上传 4.36 运行时与 Init 资产
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm32-runtime-4.36.0
          path: |
            wasm-foundry/work/artifact/**
            wasm-foundry/work/mini/Mini.olean
            wasm-foundry/work/mini.log
            wasm-foundry/work/build-flags.txt
          if-no-files-found: warn

  publish:
    name: 发布 4.36 运行时资产
    needs: finish
    if: (github.event_name == 'workflow_dispatch' && inputs.publish != 'none') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/runtime-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: wasm-foundry
    permissions:
      contents: write
      actions: read
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'push' && 'both' || inputs.publish }}
      PUBLISH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_scope || 'all' }}
      VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wasm-foundry/pnpm-lock.yaml

      # 缺少 secret 时尽早失败，不浪费下载产物和创建 Release 的时间。
      - name: 检查发布凭据
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          # Release 只是回退源：先给出可操作的提示，不要等到上传完几百 MB 才 403（Issue #82）。
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::warning::未配置 RELEASE_TOKEN，GitHub Release 回退源会以 403 失败；请在仓库 Secrets 添加一个具备 Contents: Read and write 的 PAT"
          fi
          if [ "$PUBLISH_TARGET" = "r2" ] || [ "$PUBLISH_TARGET" = "both" ]; then
            for name in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
              value="${!name}"
              [ -n "$value" ] || { echo "缺少 $name"; exit 1; }
            done
          fi
          if [ "$PUBLISH_TARGET" = "modelscope" ] || [ "$PUBLISH_TARGET" = "both" ]; then
            [ -n "$MODELSCOPE_TOKEN" ] || { echo "缺少 MODELSCOPE_TOKEN"; exit 1; }
          fi

      # 产物里的路径是 work/artifact/**，所以解压到 work 才能还原原目录。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm32-runtime-4.36.0
          path: wasm-foundry/work

      - name: 准备上传目录与候选清单
        if: env.PUBLISH_SCOPE == 'all'
        run: |
          mkdir -p public/wasm-lean4
          cp work/artifact/lean.mjs public/wasm-lean4/
          cp work/artifact/producer-receipt.json public/wasm-lean4/
          cp work/artifact/lean-init.index.json public/wasm-lean4/
          cp work/artifact/*.gz.bin public/wasm-lean4/
          cp scripts/assets/runner-worker.js public/wasm-lean4/
          # 候选清单会覆盖 config；先把仓库里的 extensions（如果有）留一份。
          cp config/lean4-runtime.json work/manifest-base.json
          cp work/artifact/runtime-manifest.json config/lean4-runtime.json
          node -e "const fs=require('fs');const base=JSON.parse(fs.readFileSync('work/manifest-base.json'));const m=JSON.parse(fs.readFileSync('config/lean4-runtime.json'));if(base.extensions)m.extensions=base.extensions;fs.writeFileSync('config/lean4-runtime.json',JSON.stringify(m,null,2)+'\n')"
          node -e "const m=require('./config/lean4-runtime.json'); console.log('manifest:', m.runtime, m.cacheKey, m.assets.length, 'assets', (m.extensions??[]).length, 'extensions')"

      # 扩展包与 Init 一起发布：只做上传，客户端仍然按需下载。
      - name: 下载 Std 扩展包
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm32-std-pack
          path: wasm-foundry/work/extensions/std

      - name: 下载 Batteries 扩展包
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm32-batteries-pack
          path: wasm-foundry/work/extensions/batteries

      - name: 生成扩展清单
        if: github.event_name == 'workflow_dispatch' && inputs.build_extensions
        run: |
          node scripts/write-extension-manifest.mjs \
            --std work/extensions/std --batteries work/extensions/batteries
          mkdir -p work/extensions/upload
          cp work/extensions/std/lean-* work/extensions/batteries/lean-* work/extensions/upload/
          node scripts/verify-manifest.mjs

      - name: 无扩展构建时只发布 Init
        if: env.PUBLISH_SCOPE == 'all' && (github.event_name != 'workflow_dispatch' || !inputs.build_extensions)
        run: |
          node -e "const fs=require('fs');const p='config/lean4-runtime.json';const m=JSON.parse(fs.readFileSync(p));delete m.extensions;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          echo '本次没有构建扩展包，跳过 Std / Batteries 上传'

      # 先保存候选清单：即使后面 R2 / 魔搭发布失败，也能拿到清单排查或重试。
      - name: 保存候选清单
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-manifest-4.36.0
          path: |
            wasm-foundry/work/artifact/runtime-manifest.json
            wasm-foundry/work/artifact/SHA256SUMS
            wasm-foundry/config/lean4-runtime.json

      - name: 上传 R2
        if: env.PUBLISH_TARGET == 'r2' || env.PUBLISH_TARGET == 'both'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "缺少 R2_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets"
            exit 1
          fi
          command -v aws >/dev/null || (sudo apt-get update && sudo apt-get install -y awscli)
          EXTRA=""
          [ "$PUBLISH_SCOPE" = "extensions" ] && EXTRA="--extensions-only"
          if [ "$VERIFY_ONLY" = "true" ]; then
            pnpm run upload:assets -- --s3 --verify-only --extensions work/extensions/upload $EXTRA
          else
            pnpm run upload:assets -- --s3 --extensions work/extensions/upload $EXTRA
          fi

      - name: 上传 ModelScope
        if: env.PUBLISH_TARGET == 'modelscope' || env.PUBLISH_TARGET == 'both'
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO: HQZMSu/lean4-assets
          MODELSCOPE_REPO_TYPE: dataset
        run: |
          if [ -z "$MODELSCOPE_TOKEN" ]; then
            echo "缺少 MODELSCOPE_TOKEN secret"
            exit 1
          fi
          command -v git-lfs >/dev/null || (sudo apt-get update && sudo apt-get install -y git-lfs)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PUBLISH_SCOPE" = "extensions" ]; then
            pnpm run upload:modelscope -- --extensions work/extensions/upload --extensions-only --metadata
          else
            pnpm run upload:modelscope -- --extensions work/extensions/upload --metadata
          fi

      # 放在 R2 / 魔搭之后：Release 只是回退源，token 缺 contents:write 时不该拖累主链路。
      - name: 发布 GitHub Release（回退源）
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          TAG="runtime-v${LEAN_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "Lean ${LEAN_VERSION} wasm32 runtime" \
              --notes "wasm32 runtime + Init oleans, packaged by GitHub Actions."
          fi
          if [ "$PUBLISH_SCOPE" = "all" ]; then
            gh release upload "$TAG" \
              work/artifact/lean.mjs \
              work/artifact/producer-receipt.json \
              work/artifact/lean-init.index.json \
              work/artifact/*.gz \
              work/artifact/*.gz.bin \
              work/artifact/runtime-manifest.json \
              work/artifact/SHA256SUMS \
              scripts/assets/runner-worker.js \
              --clobber
          fi
          if [ -d work/extensions/upload ] && ls work/extensions/upload/lean-* >/dev/null 2>&1; then
            gh release upload "$TAG" work/extensions/upload/lean-* --clobber
          fi

      - name: 发布摘要
        run: |
          node -e "const m=require('./config/lean4-runtime.json'); console.log('runtime:', m.runtime); console.log('cacheKey:', m.cacheKey); console.log('primary:', m.primary.baseUrl); console.log('fallback:', m.fallback.baseUrl); console.log('mirror:', m.mirror.baseUrl + m.mirror.prefix); for (const a of m.assets) console.log(' ', a.key, a.bytes, a.sha256.slice(0, 12)); for (const e of m.extensions ?? []) for (const a of e.assets) console.log(' ext', a.key, a.bytes, a.sha256.slice(0, 12));"
