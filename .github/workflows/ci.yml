name: CI · wasm-foundry 工具链
run-name: CI · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  pull_request:
  push:
    branches: [wasm64-v4.36.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actions 工作流静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  static:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wasm-foundry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wasm-foundry/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 代码格式
        run: pnpm run format:check
      - name: ESLint
        run: pnpm run lint
      - name: TypeScript 类型检查
        run: pnpm run typecheck
      - name: 资产清单校验
        run: pnpm run verify:manifest

  test:
    name: 单元测试与覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wasm-foundry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wasm-foundry/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Vitest 覆盖率
        run: pnpm run test:coverage
